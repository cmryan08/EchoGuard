[project]
name = "echoguard"
version = "0.1.0"
description = "Privacy-preserving, camera-free Wi-Fi CSI motion and potential-fall detection prototype (not medically validated)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
# Runtime dependencies are pinned in requirements.txt (installed by `make setup`,
# or reused offline by `make setup-offline`); optional ML extras in requirements-ml.txt.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
